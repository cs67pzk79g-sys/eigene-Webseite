<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600"
     role="img" aria-label="Schematische Vorschau der Demo-Website Bäckerei 2000">
  <!-- Eigene, schematische Darstellung. VOR DEM LAUNCH durch einen echten
       Screenshot des Projekts ersetzen (gleiches Seitenverhältnis 4:3). -->
  <defs>
    <linearGradient id="b-teig" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8C89A"/>
      <stop offset="1" stop-color="#C99356"/>
    </linearGradient>
    <clipPath id="b-rahmen"><rect x="40" y="40" width="720" height="520" rx="14"/></clipPath>
  </defs>

  <rect width="800" height="600" fill="#F3EDE4"/>

  <!-- Browserfenster -->
  <g clip-path="url(#b-rahmen)">
    <rect x="40" y="40" width="720" height="520" fill="#FFFDFA"/>

    <!-- Kopfleiste des Browsers -->
    <rect x="40" y="40" width="720" height="38" fill="#EFE6D9"/>
    <circle cx="66" cy="59" r="5" fill="#D5C3AB"/>
    <circle cx="84" cy="59" r="5" fill="#D5C3AB"/>
    <circle cx="102" cy="59" r="5" fill="#D5C3AB"/>
    <rect x="124" y="49" width="220" height="20" rx="10" fill="#FFFDFA"/>
    <rect x="136" y="56" width="96" height="6" rx="3" fill="#CBBBA3"/>

    <!-- Navigation der Website -->
    <rect x="40" y="78" width="720" height="52" fill="#FFFDFA"/>
    <rect x="72" y="96" width="132" height="16" rx="4" fill="#7A4A1E"/>
    <g fill="#C7B49B">
      <rect x="480" y="99" width="52" height="10" rx="5"/>
      <rect x="548" y="99" width="60" height="10" rx="5"/>
      <rect x="624" y="99" width="44" height="10" rx="5"/>
    </g>
    <rect x="684" y="92" width="44" height="24" rx="12" fill="#8A5A2B"/>
    <line x1="40" y1="130" x2="760" y2="130" stroke="#EADFCF" stroke-width="2"/>

    <!-- Titelbereich -->
    <rect x="40" y="130" width="720" height="200" fill="url(#b-teig)"/>
    <g opacity=".22" fill="#FFFFFF">
      <ellipse cx="612" cy="212" rx="86" ry="54" transform="rotate(-18 612 212)"/>
      <ellipse cx="668" cy="272" rx="64" ry="40" transform="rotate(-18 668 272)"/>
    </g>
    <rect x="72" y="176" width="340" height="24" rx="6" fill="#FFFFFF" opacity=".95"/>
    <rect x="72" y="212" width="272" height="24" rx="6" fill="#FFFFFF" opacity=".95"/>
    <rect x="72" y="256" width="216" height="12" rx="6" fill="#FFFFFF" opacity=".7"/>
    <rect x="72" y="288" width="150" height="34" rx="17" fill="#5E3610"/>

    <!-- Sortiments-Kacheln -->
    <g>
      <rect x="72" y="366" width="200" height="128" rx="10" fill="#FBF4EA" stroke="#EADFCF" stroke-width="2"/>
      <rect x="92" y="386" width="160" height="48" rx="6" fill="#E3CBA9"/>
      <rect x="92" y="446" width="104" height="11" rx="5" fill="#B79A76"/>
      <rect x="92" y="466" width="72" height="9" rx="4" fill="#D8C6AC"/>

      <rect x="300" y="366" width="200" height="128" rx="10" fill="#FBF4EA" stroke="#EADFCF" stroke-width="2"/>
      <rect x="320" y="386" width="160" height="48" rx="6" fill="#E3CBA9"/>
      <rect x="320" y="446" width="120" height="11" rx="5" fill="#B79A76"/>
      <rect x="320" y="466" width="64" height="9" rx="4" fill="#D8C6AC"/>

      <rect x="528" y="366" width="200" height="128" rx="10" fill="#FBF4EA" stroke="#EADFCF" stroke-width="2"/>
      <rect x="548" y="386" width="160" height="48" rx="6" fill="#E3CBA9"/>
      <rect x="548" y="446" width="92" height="11" rx="5" fill="#B79A76"/>
      <rect x="548" y="466" width="80" height="9" rx="4" fill="#D8C6AC"/>
    </g>

    <!-- Öffnungszeiten-Streifen -->
    <rect x="72" y="512" width="656" height="40" rx="10" fill="#5E3610"/>
    <g fill="#E8C89A">
      <rect x="96" y="527" width="88" height="10" rx="5"/>
      <rect x="212" y="527" width="64" height="10" rx="5"/>
      <rect x="304" y="527" width="76" height="10" rx="5"/>
    </g>
    <rect x="628" y="522" width="76" height="20" rx="10" fill="#E8C89A"/>
  </g>

  <rect x="40" y="40" width="720" height="520" rx="14" fill="none" stroke="#E0D2BE" stroke-width="2"/>
</svg>
